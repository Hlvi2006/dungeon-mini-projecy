<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dungeon Escape</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="wrapper">
  <div id="hud">
    <div class="hud-item">
      <span class="hud-label">HP</span>
      <div id="hp-bar-wrap"><div id="hp-bar"></div></div>
      <span class="hud-val" id="hp-num">100</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Gold</span>
      <span class="hud-val" id="gold-num">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Enemies</span>
      <span class="hud-val" id="enemy-num">5</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Door</span>
      <span class="hud-val" id="door-st">Locked</span>
    </div>
    <div class="hud-item">
  <span class="hud-label">Best</span>
  <span class="hud-val" id="hi-hud">0</span>
</div>

<p id="hi-score-area" class="hi-score"></p>
  </div>

  <div id="canvas-wrap">
    <canvas id="c" width="560" height="420"></canvas>
    <div id="screen">
      <h1>⚔ DUNGEON ESCAPE</h1>
      <p class="sub">Defeat all enemies · Collect treasure · Find the exit</p>
      <div class="key-hint">WASD — Move &nbsp;|&nbsp; SPACE — Attack</div>
      <button class="btn" onclick="startGame()">▶ START GAME</button>
    </div>
  </div>

  <div id="msg-bar"></div>

  <div id="controls">
    <span class="ctrl">W A S D — Move</span>
    <span class="ctrl">SPACE — Attack</span>
    <span class="ctrl">Defeat all → Reach Exit</span>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
